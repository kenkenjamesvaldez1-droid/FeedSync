<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FeedSync | View Replies</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
  font-family:"Poppins",sans-serif;
  margin:0;
  background:#eef2ff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}
h2 { color:#1e1b4b; text-align:center; margin-bottom:20px; }
.feedback-card {
  background:white;
  border-radius:15px;
  box-shadow:0 6px 15px rgba(0,0,0,0.08);
  width:100%;
  max-width:700px;
  padding:20px;
  margin-bottom:20px;
  transition:0.2s;
}
.feedback-card:hover { box-shadow:0 8px 20px rgba(0,0,0,0.15); }
.feedback-info { font-size:0.95rem; color:#374151; margin-bottom:8px; }
.feedback-info strong { color:#1e1b4b; }
.replies-list { font-size:0.9rem; color:#1e1b4b; margin-top:6px; padding-left:10px; border-left:2px solid #e0e7ff; }
.no-replies { color:#6b7280; font-style:italic; margin-top:4px; }
.reply-item { margin-bottom:6px; padding:6px 10px; background:#f3f4f6; border-radius:8px; }
.reply-time { font-size:0.75rem; color:#6b7280; margin-left:4px; }
.back-btn {
  background:#4f46e5;
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  margin-bottom:20px;
}
.back-btn:hover { background:#4338ca; }
</style>
</head>
<body>

<h2>Your Feedback & Admin Replies</h2>
<button class="back-btn" id="backBtn">⬅ Back to Dashboard</button>
<div id="feedbackContainer"></div>

<script type="module">
import { auth, db } from "./firebase.js";
import { collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const feedbackContainer = document.getElementById("feedbackContainer");
const backBtn = document.getElementById("backBtn");

// Back button
backBtn.addEventListener("click", () => {
  window.location.href = "student-dashboard.html"; // correct file name
});

auth.onAuthStateChanged(user => {
  if(!user) return window.location.href="index.html";

  // Query feedback for this user
  const q = query(
    collection(db, "studentFeedback"), // match feedback collection name
    where("studentId", "==", user.email.split("@")[0]), // or use user.uid if stored
    orderBy("timestamp", "desc") // match timestamp field from feedback
  );

  onSnapshot(q, snapshot => {
    feedbackContainer.innerHTML = "";

    if(snapshot.empty){
      feedbackContainer.innerHTML = `<p class="no-replies">No feedback found.</p>`;
      return;
    }

    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const card = document.createElement("div");
      card.classList.add("feedback-card");

      // Replies
      let repliesHTML = "";
      if(data.adminReply) {
        const time = data.timestamp?.toDate ? data.timestamp.toDate() : null;
        const formattedTime = time ? ` <span class="reply-time">(${time.toLocaleString()})</span>` : "";
        repliesHTML += `<div class="reply-item"><strong>Admin Reply:</strong> ${data.adminReply || ""}${formattedTime}</div>`;
      }
      if(data.replies && data.replies.length > 0){
        data.replies.forEach(r => {
          const rTime = r.timestamp?.toDate ? r.timestamp.toDate() : new Date(r.timestamp);
          const formattedRTime = ` <span class="reply-time">(${rTime.toLocaleString()})</span>`;
          repliesHTML += `<div class="reply-item"><strong>Admin Reply:</strong> ${r.text}${formattedRTime}</div>`;
        });
      }
      if(!repliesHTML) repliesHTML = `<div class="no-replies">No replies yet</div>`;

      card.innerHTML = `
        <div class="feedback-info"><strong>Your Comment:</strong> ${data.comments || "No comment"}</div>
        <div class="feedback-info"><strong>Area:</strong> ${data.feedbackArea || "N/A"}${data.subArea ? " | Sub Area: " + data.subArea : ""}${data.roomNumber ? " | Room: " + data.roomNumber : ""}</div>
        <div class="feedback-info"><strong>Rating:</strong> ${data.rating || "N/A"} ⭐</div>
        <div class="replies-list">
          ${repliesHTML}
        </div>
      `;

      feedbackContainer.appendChild(card);
    });
  });
});
</script>

</body>
</html>
