<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FeedSync | Admin Feedback</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
  font-family:"Poppins",sans-serif;
  margin:0;
  background:#eef2ff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}
h2 { color:#1e1b4b; text-align:center; margin-bottom:20px; }
.back-btn {
  background:#4f46e5;
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  margin-bottom:20px;
}
.back-btn:hover { background:#4338ca; }
.feedback-card {
  background:white;
  border-radius:15px;
  box-shadow:0 6px 15px rgba(0,0,0,0.08);
  width:100%;
  max-width:700px;
  padding:20px;
  margin-bottom:20px;
  position:relative;
  transition:0.2s;
}
.feedback-card:hover { box-shadow:0 8px 20px rgba(0,0,0,0.15); }
.feedback-info { font-size:0.95rem; color:#374151; margin-bottom:8px; }
.feedback-info strong { color:#1e1b4b; }
.reply-section { margin-top:12px; display:flex; gap:6px; }
.reply-input { flex:1; padding:8px 10px; border-radius:8px; border:1px solid #cbd5e1; outline:none; }
.reply-btn, .action-btn {
  padding:6px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}
.reply-btn { background:#6366f1; color:white; }
.action-btn { font-size:0.85rem; margin-right:6px; }
.mark-viewed { background:#10b981; color:white; }
.delete-feedback { background:#ef4444; color:white; }
.like-btn { background:#facc15; color:white; }
.replies-list { font-size:0.9rem; color:#1e1b4b; margin-top:6px; padding-left:10px; border-left:2px solid #e0e7ff; }
.no-replies { color:#6b7280; font-style:italic; margin-top:4px; }
</style>
</head>
<script type="module">
import { auth, db } from "./firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

// Verify admin access
auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "index.html"; // Not logged in
    return;
  }

  const userRef = doc(db, "users", user.uid);
  const userSnap = await getDoc(userRef);

  if (!userSnap.exists() || userSnap.data().role !== "admin") {
    alert("Access denied. Admins only.");
    window.location.href = "index.html";
  }
});
</script>

<body>

<h2>Student Feedback Management</h2>
<button class="back-btn" id="backBtn">⬅ Back to Dashboard</button>
<div id="feedbackContainer"></div>

<script type="module">
import { auth, db } from "./firebase.js";
import { collection, query, onSnapshot, orderBy, doc, updateDoc, arrayUnion, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const feedbackContainer = document.getElementById("feedbackContainer");
const backBtn = document.getElementById("backBtn");

// Go back to dashboard
backBtn.addEventListener("click", () => {
  window.location.href = "admindashboard.html"; // replace with your dashboard page
});

auth.onAuthStateChanged(user => {
  if(!user) return window.location.href="index.html";

  const q = query(collection(db, "feedback"), orderBy("createdAt","desc"));

  onSnapshot(q, snapshot => {
    feedbackContainer.innerHTML = "";

    if(snapshot.empty){
      feedbackContainer.innerHTML = `<p class="no-replies">No feedback available.</p>`;
      return;
    }

    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const card = document.createElement("div");
      card.classList.add("feedback-card");

      // Build card HTML
      let html = `
        <div class="feedback-info"><strong>Student:</strong> ${data.anonymous ? "Anonymous" : data.name} (${data.studentId})</div>
        <div class="feedback-info"><strong>Area:</strong> ${data.area}${data.administrationOffice ? " | Office: " + data.administrationOffice : ""}${data.facilityRoomNumber ? " | Room: " + data.facilityRoomNumber : ""}</div>
        <div class="feedback-info"><strong>Rating:</strong> ${data.rating}/5</div>
        <div class="feedback-info"><strong>Comment:</strong> ${data.comments}</div>
        <div class="replies-list" id="replies-${docSnap.id}">
          ${data.replies && data.replies.length
            ? data.replies
                .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt))
                .map(r => `<div>- ${r.text}</div>`).join("")
            : `<div class="no-replies">No replies yet</div>`
          }
        </div>
        <div class="reply-section">
          <input type="text" placeholder="Type your reply..." class="reply-input" id="replyInput-${docSnap.id}">
          <button type="button" class="reply-btn" data-id="${docSnap.id}">Send Reply</button>
        </div>
        <div class="action-buttons">
          <button class="action-btn mark-viewed" id="mark-${docSnap.id}">${data.viewed ? "Viewed ✅" : "Mark Viewed"}</button>
          <button class="action-btn delete-feedback" id="delete-${docSnap.id}">Delete ❌</button>
          <button class="action-btn like-btn" id="like-${docSnap.id}">💛 ${data.likes || 0}</button>
        </div>
      `;

      card.innerHTML = html;
      feedbackContainer.appendChild(card);

      const ref = doc(db,"feedback",docSnap.id);

      // Mark Viewed
      document.getElementById(`mark-${docSnap.id}`).addEventListener("click", async () => {
        await updateDoc(ref,{viewed:true});
      });

      // Delete Feedback
      document.getElementById(`delete-${docSnap.id}`).addEventListener("click", async () => {
        if(confirm("Are you sure you want to delete this feedback?")) {
          await deleteDoc(ref);
        }
      });

      // Like
      document.getElementById(`like-${docSnap.id}`).addEventListener("click", async () => {
        await updateDoc(ref,{likes:(data.likes||0)+1});
      });

      // Reply button
      const replyBtn = card.querySelector(".reply-btn");
      const replyInput = card.querySelector(".reply-input");
      const repliesList = card.querySelector(".replies-list");

      replyBtn.addEventListener("click", async () => {
        const text = replyInput.value.trim();
        if(!text) return;

        try {
          const newReply = { text, createdAt: new Date() };
          await updateDoc(ref, { replies: arrayUnion(newReply) });

          if(repliesList.querySelector(".no-replies")) repliesList.innerHTML = "";
          const newReplyDiv = document.createElement("div");
          newReplyDiv.textContent = `- ${text}`;
          repliesList.appendChild(newReplyDiv);

          replyInput.value = "";
        } catch(err) {
          console.error("Failed to send reply:", err);
          alert("Failed to send reply. Check console for details.");
        }
      });

    });
  });
});
</script>

</body>
</html>
