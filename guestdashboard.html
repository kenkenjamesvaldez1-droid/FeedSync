<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FeedSync | Guest Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; font-family: "Poppins", sans-serif; }
body { margin:0; display:flex; min-height:100vh; background:linear-gradient(135deg,#dbeafe,#f0f9ff); }

.sidebar { width:240px; background:linear-gradient(180deg,#1e1b4b,#3730a3); color:#fff; display:flex; flex-direction:column; align-items:center; padding:25px;}
    .sidebar img { width:70px; height:70px; border-radius:50%; margin-bottom:10px;}
    .sidebar h2 { font-size:1.3rem; margin-bottom:35px; }
    .nav-links { width:100%; }
    .nav-links a { display:flex; align-items:center; gap:10px; padding:12px 15px; color:#e0e7ff; text-decoration:none; border-radius:8px; transition:0.3s ease; cursor:pointer;}
    .nav-links a:hover { background: rgba(255,255,255,0.2); transform: translateX(5px); }

.notification { margin-top:auto; padding:15px 0; border-top:1px solid rgba(255,255,255,0.3); color:#e0f2fe; text-align:center; }

.main { flex:1; display:flex; flex-direction:column; }
.topbar { background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.1); display:flex; justify-content:space-between; align-items:center; padding:10px 25px;}
.topbar-left { display:flex; align-items:center; }
.topbar-left img { height:60px; border-radius:10px; margin-right:15px;}
.topbar-left h1 { font-size:1.4rem; color:#1e3a8a; font-weight:600; }

.profile-section { display:flex; align-items:center; gap:10px; }
.profile-section img { width:40px; height:40px; border-radius:50%; }
.profile-section button { background: linear-gradient(135deg,#3b82f6,#2563eb); border:none; border-radius:6px; color:white; padding:7px 14px; cursor:pointer; transition:0.3s ease;}
.profile-section button:hover { transform: scale(1.05); background:linear-gradient(135deg,#60a5fa,#1d4ed8); }

.dashboard-content { flex:1; display:flex; justify-content:center; align-items:center; }
.welcome-card { background:white; border-radius:25px; box-shadow:0 10px 25px rgba(0,0,0,0.1); padding:40px 50px; text-align:center; max-width:700px; animation: fadeIn 0.8s ease;}
.welcome-card h2 { font-family:"Playfair Display", serif; font-size:2rem; color:#1e3a8a; }
.welcome-card p { font-family:"Poppins", sans-serif; font-size:1.1rem; color:#2563eb; margin-top:20px; line-height:1.5; }
.welcome-card img { width:100px; height:100px; margin-bottom:15px; animation: float 3s ease-in-out infinite; }

@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
@keyframes fadeIn { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body>
  <div class="sidebar">
  <img src="logo.png" alt="FeedSync Logo">
  <h2>FeedSync Guest</h2>

  <div class="nav-links">
    <a href="guest-dashboard.html">🏠 Dashboard</a>
    <a href="guest-feedback-board.html">📝 Feedback Board</a>
    <a href="guest-updates.html">👀 View Updates</a>
    <a href="guest-about.html">ℹ️ About</a>
  </div>

  <div class="contact-details">
    <span>📞 +63.961.077.6611</span>
    <span>✉️ info@icct.edu.ph</span>
  </div>

  <div class="notification">🔔 Campus Announcements</div>
</div>


  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <img src="Caintamain.png" alt="Campus">
        <h1>FeedSync | Guest Dashboard</h1>
      </div>
      <div class="profile-section">
        <img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" alt="Guest Profile">
        <button id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="dashboard-content">
      <div class="welcome-card">
        <img src="logo.png" alt="FeedSync Logo">
        <h2>Welcome, Guest!</h2>
        <p>"Explore, observe, and share — every thought adds color to our school’s story."</p>
      </div>
    </div>
  </div>

<script type="module">
import { auth } from "./firebase.js";
import { signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "index.html";
});
</script>
</body>
</html>
